<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Soal — Admin CBT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --utama: #7c3aed;
            --gelap: #1e293b;
            --abu: #64748b;
            --muda: #f8fafc;
            --batas: #e2e8f0;
            --sukses: #10b981;
            --peringatan: #f59e0b;
            --bahaya: #ef4444;
            --biru: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(135deg, var(--utama), #6d28d9);
            color: white;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-kiri {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-kiri a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .nav-kiri a:hover { opacity: 1; }

        .nav-kiri h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .nav-kanan {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tombol-keluar {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .tombol-keluar:hover { background: rgba(255,255,255,0.3); }

        .wadah {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .kartu {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }

        .kartu h2 {
            color: var(--gelap);
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--batas);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
        }

        .form-penuh { grid-column: 1 / -1; }

        .grup-input label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--gelap);
            font-size: 14px;
        }

        .bantuan {
            font-size: 12px;
            color: var(--abu);
            margin-top: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid var(--batas);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea { resize: vertical; min-height: 90px; }

        input:focus, select:focus, textarea:focus {
            border-color: var(--utama);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .pratinjau-gambar {
            margin-top: 10px;
            max-width: 250px;
            border-radius: 10px;
            border: 2px dashed var(--batas);
            padding: 10px;
            text-align: center;
        }

        .pratinjau-gambar img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            object-fit: contain;
        }

        .baris-tombol {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .tombol {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .tombol:hover { transform: translateY(-1px); }
        .tombol-primer { background: var(--utama); color: white; }
        .tombol-sukses { background: var(--sukses); color: white; }
        .tombol-bahaya { background: var(--bahaya); color: white; }
        .tombol-abu { background: var(--abu); color: white; }
        .tombol-kecil { padding: 6px 10px; font-size: 13px; }

        .pesan {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .pesan-sukses { background: #dcfce7; color: #166534; display: block; }
        .pesan-bahaya { background: #fee2e2; color: #dc2626; display: block; }
        .pesan-info { background: #dbeafe; color: #1e40af; display: block; }

        .filter-baris {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tabel-soal {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .tabel-soal th,
        .tabel-soal td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--batas);
            vertical-align: middle;
        }

        .tabel-soal th {
            background: var(--muda);
            font-weight: 600;
            color: var(--gelap);
        }

        .tabel-soal tr:hover { background: #f8fafc; }

        .tag-mapel {
            display: inline-block;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .sembunyi { display: none !important; }
        .tengah { text-align: center; color: var(--abu); padding: 30px !important; }

        .blok-terkunci {
            text-align: center;
            padding: 80px 20px;
        }

        .blok-terkunci i {
            font-size: 64px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-kiri">
        <a href="admin-dashboard.html"><i class="fa-solid fa-chevron-left"></i> Kembali</a>
        <h1>📚 Kelola Bank Soal</h1>
    </div>
    <div class="nav-kanan">
        <span id="namaAdmin" style="font-size:14px; opacity:0.9;">Admin</span>
        <button class="tombol-keluar" onclick="keluarAdmin()">
            <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
    </div>
</nav>

<div class="wadah" id="kontenUtama">

    <!-- Pesan Notifikasi -->
    <div id="pesanNotif" class="pesan"></div>

    <!-- FORM TAMBAH / EDIT SOAL -->
    <div class="kartu">
        <h2 id="judulForm">➕ Tambah Soal Baru</h2>
        <form id="formSoal" onsubmit="return simpanSoal(event)">
            <input type="hidden" id="indeksEdit" value="-1">

            <div class="form-grid">
                <div class="grup-input">
                    <label for="pilihMapel">📚 Mata Pelajaran <span style="color:red;">*</span></label>
                    <select id="pilihMapel" required>
                        <option value="">— Pilih Mata Pelajaran —</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="IPA">IPA</option>
                        <option value="IPS">IPS</option>
                        <option value="PKN">PKN</option>
                        <option value="Agama">Agama</option>
                        <option value="TIK">TIK / Informatika</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="grup-input">
                    <label>🖼️ Foto / Gambar Soal</label>
                    <input type="file" id="unggahGambar" accept="image/*" onchange="pratinjauGambar(this)">
                    <div class="bantuan">Opsional — jika soal ada gambar, unggah di sini</div>
                    <div class="pratinjau-gambar sembunyi" id="kotakPratinjau">
                        <img id="gambarPratinjau" alt="Pratinjau Gambar">
                        <button type="button" class="tombol tombol-bahaya tombol-kecil" style="margin-top:8px;" onclick="hapusGambar()">
                            <i class="fa-solid fa-trash"></i> Hapus Gambar
                        </button>
                    </div>
                </div>

                <div class="grup-input form-penuh">
                    <label for="teksSoal">📝 Isi Soal <span style="color:red;">*</span></label>
                    <textarea id="teksSoal" placeholder="Tuliskan soal di sini..." required></textarea>
                </div>

                <div class="grup-input">
                    <label for="pilihanA">Pilihan A <span style="color:red;">*</span></label>
                    <input type="text" id="pilihanA" placeholder="Jawaban pilihan A" required>
                </div>
                <div class="grup-input">
                    <label for="pilihanB">Pilihan B <span style="color:red;">*</span></label>
                    <input type="text" id="pilihanB" placeholder="Jawaban pilihan B" required>
                </div>
                <div class="grup-input">
                    <label for="pilihanC">Pilihan C</label>
                    <input type="text" id="pilihanC" placeholder="Kosongkan jika tidak ada">
                </div>
                <div class="grup-input">
                    <label for="pilihanD">Pilihan D</label>
                    <input type="text" id="pilihanD" placeholder="Kosongkan jika tidak ada">
                </div>
                <div class="grup-input">
                    <label for="pilihanE">Pilihan E</label>
                    <input type="text" id="pilihanE" placeholder="Kosongkan jika tidak ada">
                </div>

                <div class="grup-input">
                    <label for="jawabanBenar">✅ Jawaban Benar <span style="color:red;">*</span></label>
                    <select id="jawabanBenar" required>
                        <option value="">— Pilih Jawaban Benar —</option>
                        <option value="0">A</option>
                        <option value="1">B</option>
                        <option value="2">C</option>
                        <option value="3">D</option>
                        <option value="4">E</option>
                    </select>
                </div>
            </div>

            <div class="baris-tombol">
                <button type="submit" class="tombol tombol-sukses">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Soal
                </button>
                <button type="reset" class="tombol tombol-abu" onclick="resetForm()">
                    <i class="fa-solid fa-rotate-right"></i> Reset Form
                </button>
            </div>
        </form>
    </div>

    <!-- DAFTAR SOAL -->
    <div class="kartu">
        <h2>📋 Daftar Soal (<span id="jumlahSoal">0</span> soal)</h2>

        <div class="filter-baris">
            <select id="filterMapel" onchange="tampilkanDaftarSoal()">
                <option value="">— Semua Mata Pelajaran —</option>
                <option value="Matematika">Matematika</option>
                <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                <option value="Bahasa Inggris">Bahasa Inggris</option>
                <option value="IPA">IPA</option>
                <option value="IPS">IPS</option>
                <option value="PKN">PKN</option>
                <option value="Agama">Agama</option>
                <option value="TIK">TIK / Informatika</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        </div>

        <div style="overflow-x:auto;">
            <table class="tabel-soal">
                <thead>
                    <tr>
                        <th width="60">No</th>
                        <th width="130">Mata Pelajaran</th>
                        <th>Soal</th>
                        <th width="100">Jawaban</th>
                        <th width="60">Gambar</th>
                        <th width="140">Aksi</th>
                    </tr>
                </thead>
                <tbody id="daftarSoalTabel">
                    <!-- Daftar soal dimuat otomatis -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Halaman Terkunci -->
<div id="blokTerkunci" class="blok-terkunci sembunyi">
    <i class="fa-solid fa-lock"></i>
    <h3>Akses Terkunci</h3>
    <p style="color:#64748b; margin:10px 0 24px;">Anda harus login sebagai Admin untuk mengelola soal.</p>
    <a href="admin-login.html" style="background:#7c3aed; color:white; padding:10px 20px; border-radius:10px; text-decoration:none; display:inline-block;">Login Admin</a>
</div>

<script>
// ==========================================================
// ✅ GANTI URL INI DENGAN URL MILIK ANDA DARI APPS SCRIPT
// ==========================================================
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbyLyGbcILAE5qqTzdDpfvjdwiQnkieGJOT3uY0wwruM_OL8PqCU63crZEg-a6QNYadW/exec";

// ==========================================================
// 🔧 FUNGSI BANTUAN: BACA & KIRIM DATA KE GOOGLE SHEETS
// ==========================================================
async function bacaData(aksi, param = {}) {
  const p = new URLSearchParams({ action: aksi, ...param });
  const res = await fetch(`${URL_GOOGLE_SHEETS}?${p}`);
  return await res.json();
}

async function kirimData(aksi, obj) {
  const p = new URLSearchParams({ action: aksi, data: JSON.stringify(obj) });
  const res = await fetch(`${URL_GOOGLE_SHEETS}?${p}`);
  return await res.json();
}

// ======================================
// CEK HAK AKSES
// ======================================
let gambarTerbaca = "";

window.onload = function() {
  const dataAdmin = JSON.parse(localStorage.getItem('adminCBT') || 'null');
  if (!dataAdmin || dataAdmin.masuk !== true) {
    document.getElementById('blokTerkunci').classList.remove('sembunyi');
    document.getElementById('kontenUtama').classList.add('sembunyi');
    return;
  }
  document.getElementById('namaAdmin').textContent = dataAdmin.nama;
  tampilkanDaftarSoal();
};

function keluarAdmin() {
  if (confirm("Yakin ingin keluar?")) {
    localStorage.removeItem('adminCBT');
    window.location.href = "admin-login.html";
  }
}

// ======================================
// PRATINJAU & BACA GAMBAR SOAL
// ======================================
function pratinjauGambar(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];

    // ⚠️ Batasi ukuran gambar maksimal 1 MB
    if (file.size > 1 * 1024 * 1024) {
      alert("⚠️ Ukuran gambar terlalu besar!\nMaksimal 1 MB. Silakan kompres dulu sebelum diunggah.");
      input.value = "";
      return;
    }

    const pembaca = new FileReader();
    pembaca.onload = function(e) {
      gambarTerbaca = e.target.result;
      document.getElementById('gambarPratinjau').src = gambarTerbaca;
      document.getElementById('kotakPratinjau').classList.remove('sembunyi');
    };
    pembaca.readAsDataURL(file);
  }
}

function hapusGambar() {
  gambarTerbaca = "";
  document.getElementById('unggahGambar').value = "";
  document.getElementById('kotakPratinjau').classList.add('sembunyi');
  document.getElementById('gambarPratinjau').src = "";
}

// ======================================
// ✅ SIMPAN SOAL — VERSI GOOGLE SHEETS
// ======================================
async function simpanSoal(event) {
  event.preventDefault();

  const mapel = document.getElementById('pilihMapel').value.trim();
  const soalTeks = document.getElementById('teksSoal').value.trim();
  const A = document.getElementById('pilihanA').value.trim();
  const B = document.getElementById('pilihanB').value.trim();
  const C = document.getElementById('pilihanC').value.trim();
  const D = document.getElementById('pilihanD').value.trim();
  const E = document.getElementById('pilihanE').value.trim();
  const jawabanBenar = parseInt(document.getElementById('jawabanBenar').value);
  const indeksEdit = parseInt(document.getElementById('indeksEdit').value);

  if (!mapel || !soalTeks || !A || !B || isNaN(jawabanBenar)) {
    tampilkanPesan("❌ Lengkapi semua kolom yang bertanda bintang!", "bahaya");
    return false;
  }

  // Susun daftar pilihan
  const pilihan = [A, B];
  if (C) pilihan.push(C);
  if (D) pilihan.push(D);
  if (E) pilihan.push(E);

  // ✅ LOGIKA GAMBAR: Jika edit tanpa ganti gambar → ambil gambar lama
  let gambarAkhir = gambarTerbaca;

  const soalBaru = {
    idx: indeksEdit,
    mapel: mapel,
    soal: soalTeks,
    pilihan: pilihan,
    jawabanBenar: jawabanBenar,
    gambar: gambarAkhir
  };

  // ✅ KIRIM KE GOOGLE SHEETS
  const res = await kirimData('simpanSoal', soalBaru);

  if (res.status === "sukses") {
    tampilkanPesan("✅ Soal berhasil disimpan ke Google Sheets!", "sukses");
    resetForm();
    tampilkanDaftarSoal();
  } else {
    tampilkanPesan("❌ Gagal menyimpan: " + (res.pesan || "Kesalahan tidak diketahui"), "bahaya");
  }

  return false;
}

// ======================================
// ✅ TAMPILKAN DAFTAR SOAL — VERSI GOOGLE SHEETS
// ======================================
async function tampilkanDaftarSoal() {
  // ✅ BACA DATA DARI GOOGLE SHEETS
  const res = await bacaData('bacaSoal');
  const semuaSoal = res.data || [];

  const filter = document.getElementById('filterMapel').value;
  const daftar = filter ? semuaSoal.filter(s => s.mapel === filter) : semuaSoal;

  document.getElementById('jumlahSoal').textContent = daftar.length;
  const tbody = document.getElementById('daftarSoalTabel');
  tbody.innerHTML = "";

  if (daftar.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="tengah">Belum ada soal. Silakan tambahkan soal baru di atas.</td></tr>`;
    return;
  }

  daftar.forEach((soal, idx) => {
    const nomorAsli = semuaSoal.indexOf(soal) + 1;
    const baris = document.createElement('tr');
    baris.innerHTML = `
      <td>${nomorAsli}</td>
      <td><span class="tag-mapel">${soal.mapel}</span></td>
      <td style="max-width:350px;">${potongTeks(soal.soal, 60)}</td>
      <td>${['A','B','C','D','E'][soal.jawabanBenar] || '-'}</td>
      <td style="text-align:center;">${soal.gambar ? '<i class="fa-solid fa-image" title="Ada Gambar"></i>' : '-'}</td>
      <td>
        <button class="tombol tombol-primer tombol-kecil" onclick="editSoal(${nomorAsli - 1})">
          <i class="fa-solid fa-pen-to-square"></i> Edit
        </button>
        <button class="tombol tombol-bahaya tombol-kecil" onclick="hapusSoal(${nomorAsli - 1})">
          <i class="fa-solid fa-trash"></i> Hapus
        </button>
      </td>
    `;
    tbody.appendChild(baris);
  });
}

// ======================================
// EDIT SOAL
// ======================================
async function editSoal(indeks) {
  // ✅ BACA ULANG DARI GOOGLE SHEETS
  const res = await bacaData('bacaSoal');
  const semuaSoal = res.data || [];
  const soal = semuaSoal[indeks];

  document.getElementById('indeksEdit').value = indeks;
  document.getElementById('judulForm').textContent = "✏️ Edit Soal";
  document.getElementById('pilihMapel').value = soal.mapel;
  document.getElementById('teksSoal').value = soal.soal;
  document.getElementById('pilihanA').value = soal.pilihan[0] || '';
  document.getElementById('pilihanB').value = soal.pilihan[1] || '';
  document.getElementById('pilihanC').value = soal.pilihan[2] || '';
  document.getElementById('pilihanD').value = soal.pilihan[3] || '';
  document.getElementById('pilihanE').value = soal.pilihan[4] || '';
  document.getElementById('jawabanBenar').value = soal.jawabanBenar;

  // ✅ Tampilkan gambar lama saat edit
  if (soal.gambar && soal.gambar !== "") {
    gambarTerbaca = soal.gambar;
    document.getElementById('gambarPratinjau').src = soal.gambar;
    document.getElementById('kotakPratinjau').classList.remove('sembunyi');
  } else {
    gambarTerbaca = "";
    document.getElementById('kotakPratinjau').classList.add('sembunyi');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ======================================
// HAPUS SOAL
// ======================================
async function hapusSoal(indeks) {
  if (confirm("⚠️ Yakin ingin menghapus soal ini?\nTindakan ini tidak dapat dibatalkan!")) {
    // ✅ KIRIM PERINTAH HAPUS KE GOOGLE SHEETS
    const res = await bacaData('hapusSoal', { idx: indeks });
    if (res.status === "sukses") {
      tampilkanPesan("✅ Soal berhasil dihapus!", "sukses");
      tampilkanDaftarSoal();
    } else {
      tampilkanPesan("❌ Gagal menghapus!", "bahaya");
    }
  }
}

// ======================================
// FUNGSI BANTUAN
// ======================================
function resetForm() {
  document.getElementById('formSoal').reset();
  document.getElementById('indeksEdit').value = "-1";
  document.getElementById('judulForm').textContent = "➕ Tambah Soal Baru";
  hapusGambar();
}

function potongTeks(teks, panjang) {
  return teks.length > panjang ? teks.substring(0, panjang) + "..." : teks;
}

function tampilkanPesan(teks, jenis) {
  const kotak = document.getElementById('pesanNotif');
  kotak.className = "pesan pesan-" + jenis;
  kotak.textContent = teks;
  setTimeout(() => { kotak.style.display = "none"; }, 5000);
}
</script>

</body>
</html>
